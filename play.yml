---
name: install nginx
hosts: all
tasks:
  - name: install nginx on Debian
    apt:
      name: nginx
      state: present
    when: ansible_os_family == "Debian"

name: install nginx
hosts: redhat_hosts
tasks:
  - name: install nginx on RedHat
  yum:
    name: nginx
    state: present
  when: ansible_os_family == "Redhat" or ansible_os_family == "SUSE"
